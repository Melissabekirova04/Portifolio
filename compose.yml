services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelplanner
      POSTGRES_USER: travelplanner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD mangler}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelplanner -d travelplanner"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:7070"
    environment:
      DB_URL: jdbc:postgresql://db:5432/travelplanner
      DB_USERNAME: travelplanner
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD mangler}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET mangler}
      DUFFEL_TOKEN: ${DUFFEL_TOKEN:?DUFFEL_TOKEN mangler}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
